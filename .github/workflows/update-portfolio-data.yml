name: Update portfolio data

on:
  schedule:
    # Every Monday 14:00 UTC (~9am ET)
    - cron: "0 14 * * 1"
    # 1st of each month — refresh YTD period label and latest month data
    - cron: "0 14 1 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: screener/requirements.txt

      - name: Install dependencies
        run: pip install -r screener/requirements.txt

      - name: Generate portfolio-data.js
        run: python screener/generate_portfolio_data.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add portfolio-data.js
          if git diff --staged --quiet; then
            echo "No data changes."
          else
            git commit -m "chore: refresh portfolio data from Yahoo Finance"
            git push
          fi
